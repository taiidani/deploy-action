services:
  ddns-updater:
    image: ghcr.io/qdm12/ddns-updater
    network_mode: bridge
    x-machines: web
    x-ports:
      - 8000:8000@host
    volumes:
      - /data/ddns:/updater/data
    environment:
      - CONFIG=secret://ddns_config
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - PUBLICIPV4_HTTP_PROVIDERS=all
      - PUBLICIPV6_HTTP_PROVIDERS=all
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_DNS_TIMEOUT=3s
      - HTTP_TIMEOUT=10s

      # Web UI
      - LISTENING_ADDRESS=:8000
      - ROOT_URL=/

      # Backup
      - BACKUP_PERIOD=0 # 0 to disable
      - BACKUP_DIRECTORY=/updater/data

      # Other
      - LOG_LEVEL=info
      - LOG_CALLER=hidden
    # - SHOUTRRR_ADDRESSES=
    restart: always

secrets:
  ddns_config:
    x-command: sh -c 'sed "s|yourtoken|$(fnox get DIGITALOCEAN_TOKEN)|" config.json'
