services:
  plex:
    image: plexinc/pms-docker:1.43.3.10861-07dfddaeb
    x-machines: media
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - PLEX_CLAIM=claim-KzhcBnt3seFMoXX88t8X
    mem_limit: 1.5g
    mem_reservation: 500m
    volumes:
      - /data/plex/config:/config
      - /data/plex/transcode/temp:/transcode
      - plex-nfs-content:/data
    x-ports:
      - "32400:32400@host"

volumes:
  plex-nfs-content:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=192.168.102.3,nfsvers=3,proto=tcp,nconnect=4,rsize=1048576,noatime,actimeo=600,hard,timeo=100,retrans=3"
      device: ":/var/nfs/shared/Storage/content"
