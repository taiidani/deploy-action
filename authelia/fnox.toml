default_provider = "onepass"

[providers.onepass]
type = "1password"
vault = "Development"

[secrets]
"AUTHELIA_JWT_SECRET"= { provider = "onepass", value = "authelia jwt_secret" }
"AUTHELIA_STORAGE_ENCRYPTION_KEY"= { provider = "onepass", value = "authelia storage_encryption_key" }
"AUTHELIA_OIDC_HMAC_SECRET"= { provider = "onepass", value = "authelia oidc_hmac_secret" }
"AUTHELIA_OIDC_ISSUER_PRIVATE_KEY"= { provider = "onepass", value = "authelia oidc_issuer_private_key" }
