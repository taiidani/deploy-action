---
services:
  authelia:
    image: "docker.io/authelia/authelia:latest"
    x-machines: web
    restart: "unless-stopped"
    configs:
      - source: authelia_config
        target: /config/configuration.yml
        mode: 0644
    environment:
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: "secret://JWT_SECRET"
      AUTHELIA_STORAGE_ENCRYPTION_KEY: "secret://STORAGE_ENCRYPTION_KEY"
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: "secret://OIDC_HMAC_SECRET"
      # Enables Go template filters in configuration.yml, needed to inject OIDC_ISSUER_PRIVATE_KEY into the
      # identity_providers.oidc.jwks list (list values can't be set via plain AUTHELIA_ env vars).
      X_AUTHELIA_CONFIG_FILTERS: "template"
      # Deliberately not AUTHELIA_-prefixed: the template `env` function excludes AUTHELIA_*/X_AUTHELIA_* vars
      # ending in KEY/SECRET/etc, and this is only consumed by the template filter above, not Authelia's own
      # env var config layer.
      OIDC_ISSUER_PRIVATE_KEY: "secret://OIDC_ISSUER_PRIVATE_KEY"
    x-ports:
      - "auth.taiidani.com:9091/https"
    volumes:
      - "/data/authelia/config:/config"

configs:
  authelia_config:
    file: ./configuration.yml

secrets:
  JWT_SECRET:
    x-command: fnox get AUTHELIA_JWT_SECRET
  STORAGE_ENCRYPTION_KEY:
    x-command: fnox get AUTHELIA_STORAGE_ENCRYPTION_KEY
  OIDC_HMAC_SECRET:
    x-command: fnox get AUTHELIA_OIDC_HMAC_SECRET
  OIDC_ISSUER_PRIVATE_KEY:
    x-command: fnox get AUTHELIA_OIDC_ISSUER_PRIVATE_KEY
...
