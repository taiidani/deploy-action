services:
  jellyfin:
    image: jellyfin/jellyfin:12.0-rc6
    restart: "unless-stopped"
    x-machines: media
    group_add:
      - "105"
    x-ports:
      - 8096:8096@host
      - 7359:7359@host
      # - 8096:8096/tcp
      # - 7359:7359/udp
    volumes:
      - /data/jellyfin/config:/config
      - /data/jellyfin/cache:/cache
      - type: bind
        source: /mnt/unas/content
        target: /media
      # - type: bind
      #   source: /data/jellyfin/media2
      #   target: /media2
      #   read_only: true
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      # - type: bind
      #   source: /data/jellyfin/fonts
      #   target: /usr/local/share/fonts/custom
      #   read_only: true
    # Optional - alternative address used for autodiscovery
    # environment:
    # - JELLYFIN_PublishedServerUrl=http://terra:8096
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # devices:
    #   - /dev/dri/renderD105:/dev/dri/renderD105
