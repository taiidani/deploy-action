services:
  alloy:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      mode: global
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/data/alloy:/var/lib/alloy/data"
    # Alloy UI (optional, LAN-only). Useful for debugging the pipeline.
    x-ports:
      - "12345:12345/tcp@host"
      # OTLP trace receivers for local apps (gRPC / HTTP).
      - "4317:4317/tcp@host"
      - "4318:4318/tcp@host"
