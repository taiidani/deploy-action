##
## Custom Grafana configuration
## See: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
##

[server]
root_url = https://grafana.taiidani.com/

[auth]
disable_login_form = true
oauth_auto_login = true

# SSO via the Authelia OIDC provider. Replaces Grafana's built-in login form.
[auth.generic_oauth]
enabled = true
name = Authelia
icon = signin
client_id = grafana
scopes = openid profile email groups
empty_scopes = false
auth_url = https://auth.taiidani.com/api/oidc/authorization
token_url = https://auth.taiidani.com/api/oidc/token
api_url = https://auth.taiidani.com/api/oidc/userinfo
login_attribute_path = preferred_username
groups_attribute_path = groups
name_attribute_path = name
use_pkce = true
auth_style = InHeader

# Members of the Authelia 'admins' group get Grafana Server Admin; everyone else defaults to Viewer
# (via auto_assign_org_role). Note: Authelia's ID token doesn't carry the 'groups' claim (only the
# UserInfo endpoint response does), and Grafana tries the ID token first, falling back to UserInfo only
# if no *valid role* was found there. So this expression must evaluate to a non-role value (e.g. `false`)
# when 'groups' is absent/non-matching, rather than a hardcoded 'Viewer' fallback -- otherwise Grafana
# would treat that as a found role on the ID token pass and never check UserInfo's groups at all.
role_attribute_path = "contains(groups || `[]`, 'admins') && 'GrafanaAdmin'"
allow_assign_grafana_admin = true
