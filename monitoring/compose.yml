services:
  monitoring-grafana:
    build:
      context: .
      dockerfile: grafana.dockerfile
    x-ports:
      - grafana.taiidani.com:3000/https
    x-machines: monitoring
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 500m
    environment:
      GF_SERVER_ROOT_URL: https://grafana.taiidani.com/
      # Consumed by alerting provisioning (provisioning/alerting/contactpoints.yml).
      DISCORD_WEBHOOK_URL: secret://GRAFANA_DISCORD_WEBHOOK
      # SSO via the Authelia OIDC provider (see ../authelia/). Replaces Grafana's built-in login form.
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Authelia"
      GF_AUTH_GENERIC_OAUTH_ICON: "signin"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: secret://GRAFANA_OIDC_CLIENT_SECRET
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email groups"
      GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: "false"
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.taiidani.com/api/oidc/authorization
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.taiidani.com/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.taiidani.com/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: "groups"
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: "name"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups || `[]`, 'admins') && 'GrafanaAdmin'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_STYLE: InHeader
    volumes:
      - "/data/monitoring/grafana:/var/lib/grafana"
    depends_on:
      - monitoring-prometheus

  monitoring-prometheus:
    build:
      context: .
      dockerfile: prometheus.dockerfile
    x-ports:
      - "9095:9090/tcp@host"
    x-machines: monitoring
    mem_limit: 500m
    mem_reservation: 100m
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - "/data/monitoring/prometheus:/prometheus"

  # Log aggregation. Per-host Grafana Alloy agents (see ../alloy/) push Docker
  # container logs here. LAN-only (port 3100) so off-host agents can reach it.
  monitoring-loki:
    build:
      context: .
      dockerfile: loki.dockerfile
    x-ports:
      - "3100:3100/tcp@host"
    x-machines: monitoring
    mem_limit: 500m
    mem_reservation: 100m
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - "/data/monitoring/loki:/loki"

  # Distributed trace storage. Per-host Grafana Alloy agents (see ../alloy/)
  # receive OTLP traces from local apps and forward them here. LAN-only so
  # off-host agents can reach it.
  monitoring-tempo:
    build:
      context: .
      dockerfile: tempo.dockerfile
    x-ports:
      - "3200:3200/tcp@host" # Tempo query API (Grafana datasource)
      # OTLP gRPC receiver. Published on host 4417 because the local Alloy on
      # this host already binds 4317 for its own OTLP receiver.
      - "4417:4317/tcp@host"
    x-machines: monitoring
    mem_limit: 500m
    mem_reservation: 100m
    restart: unless-stopped
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - "/data/monitoring/tempo:/var/tempo"

secrets:
  GRAFANA_DISCORD_WEBHOOK:
    x-command: fnox get GRAFANA_DISCORD_WEBHOOK
  GRAFANA_OIDC_CLIENT_SECRET:
    x-command: fnox get GRAFANA_OIDC_CLIENT_SECRET
