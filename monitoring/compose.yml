services:
  monitoring-grafana:
    build:
      context: .
      dockerfile: grafana.dockerfile
    x-ports:
      - grafana.taiidani.com:3000/https
    x-machines: monitoring
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 500m
    configs:
      - source: grafana_config
        target: /etc/grafana/grafana.ini
        mode: 0644
    environment:
      # Consumed by alerting provisioning (provisioning/alerting/contactpoints.yml).
      DISCORD_WEBHOOK_URL: secret://GRAFANA_DISCORD_WEBHOOK
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: secret://GRAFANA_OIDC_CLIENT_SECRET
    volumes:
      - "/data/monitoring/grafana:/var/lib/grafana"
    depends_on:
      - monitoring-prometheus

  monitoring-prometheus:
    image: prom/prometheus:v3.13.0
    x-ports:
      - "9095:9090/tcp@host"
    x-machines: monitoring
    mem_limit: 500m
    mem_reservation: 100m
    restart: unless-stopped
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        mode: 0644
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - "/data/monitoring/prometheus:/prometheus"

  # Log aggregation. Per-host Grafana Alloy agents (see ../alloy/) push Docker
  # container logs here. LAN-only (port 3100) so off-host agents can reach it.
  monitoring-loki:
    image: grafana/loki:3.7.3
    x-ports:
      - "3100:3100/tcp@host"
    x-machines: monitoring
    mem_limit: 500m
    mem_reservation: 100m
    restart: unless-stopped
    configs:
      - source: loki_config
        target: /etc/loki/loki-config.yml
        mode: 0644
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - "/data/monitoring/loki:/loki"

  # Distributed trace storage. Per-host Grafana Alloy agents (see ../alloy/)
  # receive OTLP traces from local apps and forward them here. LAN-only so
  # off-host agents can reach it.
  monitoring-tempo:
    image: grafana/tempo:3.0.2
    x-ports:
      - "3200:3200/tcp@host" # Tempo query API (Grafana datasource)
      # OTLP gRPC receiver. Published on host 4417 because the local Alloy on
      # this host already binds 4317 for its own OTLP receiver.
      - "4417:4317/tcp@host"
    x-machines: monitoring
    restart: unless-stopped
    mem_limit: 500m
    mem_reservation: 100m
    configs:
      - source: tempo_config
        target: /etc/tempo/tempo-config.yml
        mode: 0644
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - "/data/monitoring/tempo:/var/tempo"

configs:
  grafana_config:
    file: ./grafana.ini
  tempo_config:
    file: ./tempo-config.yml
  prometheus_config:
    file: ./prometheus.yml
  loki_config:
    file: ./loki-config.yml

secrets:
  GRAFANA_DISCORD_WEBHOOK:
    x-command: fnox get GRAFANA_DISCORD_WEBHOOK
  GRAFANA_OIDC_CLIENT_SECRET:
    x-command: fnox get GRAFANA_OIDC_CLIENT_SECRET
